<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>TaskPlus - Task & Schedule Manager</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#6366f1">
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    body { background-color: #0f172a; color: #f8fafc; }
    .custom-scrollbar::-webkit-scrollbar { width: 4px; }
    .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
    .custom-scrollbar::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }
    .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: #475569; }
  </style>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js').catch((error) => {
          console.log('ServiceWorker registration failed:', error);
        });
      });
    }
  </script>
</head>
<body class="h-[100dvh] flex flex-col overflow-hidden selection:bg-indigo-500/30">

  <!-- Header -->
  <header class="bg-slate-900 border-b border-slate-800 px-4 py-3 md:px-6 flex items-center justify-between z-10 flex-shrink-0">
    <div class="flex items-center gap-3">
      <div class="w-8 h-8 rounded-lg bg-indigo-500 flex items-center justify-center text-white shadow-lg shadow-indigo-500/20">
        <i class="fas fa-bolt"></i>
      </div>
      <h1 class="text-xl font-bold bg-clip-text text-transparent bg-gradient-to-r from-white to-slate-400">TaskPlus</h1>
    </div>
    
    <div class="flex items-center gap-2 md:gap-4">
      <!-- Hidden File Input for Data Import -->
      <input type="file" id="importFile" class="hidden" accept=".json" onchange="importData(event)">
      
      <!-- Export/Import Buttons -->
      <div class="flex items-center border-r border-slate-700 pr-2 md:pr-4 mr-1 md:mr-2">
        <button onclick="exportData()" class="p-2 text-slate-400 hover:text-indigo-400 transition-colors" title="Export Data Backup">
          <i class="fas fa-download"></i>
        </button>
        <button onclick="document.getElementById('importFile').click()" class="p-2 text-slate-400 hover:text-indigo-400 transition-colors" title="Import Data Backup">
          <i class="fas fa-upload"></i>
        </button>
      </div>

      <button onclick="openEditTaskModal()" class="bg-indigo-500 hover:bg-indigo-400 text-white px-4 py-2 rounded-lg font-medium transition-all shadow-lg shadow-indigo-500/20 flex items-center gap-2 text-sm">
        <i class="fas fa-plus"></i> <span class="hidden sm:inline">New Task</span>
      </button>
    </div>
  </header>

  <!-- Mobile View Toggle -->
  <div class="md:hidden flex bg-slate-800/80 p-1 mx-4 mt-4 rounded-lg border border-slate-700 flex-shrink-0">
    <button id="btnListView" onclick="setMobileView('list')" class="flex-1 py-2 text-sm font-medium rounded-md bg-indigo-500 text-white shadow transition-all">
      <i class="fas fa-tasks mr-2"></i>Tasks
    </button>
    <button id="btnCalendarView" onclick="setMobileView('calendar')" class="flex-1 py-2 text-sm font-medium rounded-md text-slate-400 hover:text-slate-200 transition-all">
      <i class="far fa-calendar-alt mr-2"></i>Calendar
    </button>
  </div>

  <!-- Main Content Grid -->
  <main class="flex-1 overflow-hidden p-4 md:p-6 grid grid-cols-1 md:grid-cols-12 gap-6 relative">
    
    <!-- LEFT PANEL: Task List -->
    <div id="taskPanel" class="flex md:flex flex-col gap-4 md:col-span-4 lg:col-span-3 h-full overflow-hidden w-full">
      
      <!-- Filters -->
      <div class="flex flex-col gap-3 flex-shrink-0">
        <!-- Main Filters -->
        <div class="grid grid-cols-3 bg-slate-800/50 rounded-xl p-1 border border-slate-700/50">
          <button onclick="setFilter('all')" id="filter-all" class="filter-btn active-filter px-3 py-1.5 rounded-lg text-sm font-medium transition-all bg-indigo-500 text-white shadow">All</button>
          <button onclick="setFilter('today')" id="filter-today" class="filter-btn px-3 py-1.5 rounded-lg text-sm font-medium transition-all text-slate-400 hover:text-slate-200">Today</button>
          <button onclick="setFilter('important')" id="filter-important" class="filter-btn px-3 py-1.5 rounded-lg text-sm font-medium transition-all text-slate-400 hover:text-slate-200">Important</button>
        </div>
        
        <!-- Status Filters -->
        <div class="flex flex-wrap gap-2">
          <button onclick="setStatusFilter('all')" id="status-all" class="status-btn active-status-btn px-3 py-1 rounded-lg text-xs font-medium border border-indigo-500/50 bg-indigo-500/20 text-indigo-300 transition-all">All Status</button>
          <button onclick="setStatusFilter('todo')" id="status-todo" class="status-btn px-3 py-1 rounded-lg text-xs font-medium border border-slate-700 bg-slate-800/50 text-slate-400 hover:bg-slate-700 transition-all">To Do</button>
          <button onclick="setStatusFilter('in_progress')" id="status-in_progress" class="status-btn px-3 py-1 rounded-lg text-xs font-medium border border-slate-700 bg-slate-800/50 text-slate-400 hover:bg-slate-700 transition-all">In Progress</button>
          <button onclick="setStatusFilter('completed')" id="status-completed" class="status-btn px-3 py-1 rounded-lg text-xs font-medium border border-slate-700 bg-slate-800/50 text-slate-400 hover:bg-slate-700 transition-all">Completed</button>
        </div>

        <!-- Category Pills -->
        <div id="categoryFilters" class="flex flex-wrap gap-2 pb-2 border-b border-slate-800">
          <!-- Populated dynamically -->
        </div>
      </div>

      <!-- Task List Scroll Area -->
      <div id="taskList" class="flex-1 overflow-y-auto custom-scrollbar flex flex-col gap-3 pb-20 md:pb-0 pr-1">
        <!-- Tasks populated here -->
      </div>
    </div>

    <!-- RIGHT PANEL: Calendar (Hidden on mobile by default) -->
    <div id="calendarPanel" class="hidden md:flex flex-col gap-4 md:col-span-8 lg:col-span-9 h-full bg-slate-900/50 rounded-2xl border border-slate-800 p-4 md:p-6 overflow-hidden w-full">
      <div class="flex items-center justify-between flex-shrink-0">
        <h2 id="currentMonthYear" class="text-xl md:text-2xl font-bold flex items-center gap-2">
          <i class="far fa-calendar-alt text-indigo-400"></i>
          <span></span>
        </h2>
        <div class="flex items-center gap-2 bg-slate-800/80 rounded-xl p-1 border border-slate-700">
          <button onclick="changeMonth(-1)" class="p-2 px-3 text-slate-400 hover:text-white transition-colors rounded-lg hover:bg-slate-700"><i class="fas fa-chevron-left"></i></button>
          <button onclick="goToToday()" class="px-4 py-1.5 text-sm font-medium text-slate-300 hover:text-white transition-colors">Today</button>
          <button onclick="changeMonth(1)" class="p-2 px-3 text-slate-400 hover:text-white transition-colors rounded-lg hover:bg-slate-700"><i class="fas fa-chevron-right"></i></button>
        </div>
      </div>
      <div id="calendarGrid" class="grid grid-cols-7 gap-1 md:gap-2 flex-1 overflow-y-auto custom-scrollbar content-start">
        <!-- Calendar populated here -->
      </div>
    </div>
  </main>

  <!-- Task Modal Overlay -->
  <div id="taskModal" class="fixed inset-0 bg-slate-950/80 backdrop-blur-sm hidden z-50 flex items-center justify-center p-4 opacity-0 transition-opacity">
    <div class="bg-slate-900 border border-slate-700 rounded-2xl w-full max-w-lg shadow-2xl flex flex-col max-h-[90vh]">
      <div class="p-5 border-b border-slate-800 flex justify-between items-center flex-shrink-0">
        <h3 id="modalTitle" class="text-xl font-semibold">New Task</h3>
        <button onclick="closeModal()" class="text-slate-400 hover:text-white p-1"><i class="fas fa-times text-lg"></i></button>
      </div>
      
      <div class="p-5 overflow-y-auto custom-scrollbar flex-1">
        <input type="hidden" id="taskId">
        
        <div class="space-y-4">
          <div>
            <label class="block text-xs font-medium text-slate-400 uppercase tracking-wider mb-1">Title <span class="text-rose-400">*</span></label>
            <input type="text" id="taskTitle" placeholder="What needs to be done?" class="w-full bg-slate-800 border border-slate-700 rounded-lg px-4 py-2.5 text-white placeholder-slate-500 focus:outline-none focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 transition-all">
          </div>
          
          <div>
            <label class="block text-xs font-medium text-slate-400 uppercase tracking-wider mb-1">Description</label>
            <textarea id="taskDesc" rows="2" placeholder="Add details..." class="w-full bg-slate-800 border border-slate-700 rounded-lg px-4 py-2.5 text-white placeholder-slate-500 focus:outline-none focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 transition-all resize-none"></textarea>
          </div>

          <!-- Subtasks Section -->
          <div class="bg-slate-800/50 p-3 rounded-lg border border-slate-700/50">
            <label class="block text-xs font-medium text-slate-400 uppercase tracking-wider mb-2">Subtasks</label>
            <div class="flex gap-2 mb-3">
              <input type="text" id="newSubtaskInput" placeholder="Add a subtask..." class="flex-1 bg-slate-900 border border-slate-700 rounded-lg px-3 py-1.5 text-sm text-white focus:outline-none focus:border-indigo-500">
              <button onclick="addSubtaskFromModal()" type="button" class="bg-indigo-500 hover:bg-indigo-400 text-white px-3 py-1.5 rounded-lg text-sm transition-colors"><i class="fas fa-plus"></i></button>
            </div>
            <div id="modalSubtaskList" class="flex flex-col gap-2 max-h-32 overflow-y-auto custom-scrollbar">
              <!-- Subtasks populated here -->
            </div>
          </div>
          
          <div class="grid grid-cols-2 gap-4">
            <div>
              <label class="block text-xs font-medium text-slate-400 uppercase tracking-wider mb-1">Due Date</label>
              <input type="date" id="taskDate" class="w-full bg-slate-800 border border-slate-700 rounded-lg px-4 py-2 text-white focus:outline-none focus:border-indigo-500 [color-scheme:dark]">
            </div>
            <div>
              <label class="block text-xs font-medium text-slate-400 uppercase tracking-wider mb-1">Category</label>
              <input type="text" id="taskCategory" placeholder="e.g. Work, Study" list="categoryOptions" class="w-full bg-slate-800 border border-slate-700 rounded-lg px-4 py-2 text-white placeholder-slate-500 focus:outline-none focus:border-indigo-500">
              <datalist id="categoryOptions"></datalist>
            </div>
          </div>
          
          <div class="flex items-center gap-6 pt-2">
            <label class="flex items-center gap-2 cursor-pointer group">
              <div class="relative flex items-center justify-center">
                <input type="checkbox" id="taskImportant" class="peer sr-only">
                <div class="w-5 h-5 rounded border border-slate-600 bg-slate-800 peer-checked:bg-amber-500 peer-checked:border-amber-500 transition-all"></div>
                <i class="fas fa-check text-white text-xs absolute opacity-0 peer-checked:opacity-100"></i>
              </div>
              <span class="text-sm text-slate-300 group-hover:text-white transition-colors">Mark as Important</span>
            </label>
          </div>
        </div>
      </div>
      
      <div class="p-5 border-t border-slate-800 flex justify-end gap-3 flex-shrink-0 bg-slate-900 rounded-b-2xl">
        <button onclick="closeModal()" class="px-4 py-2 rounded-lg text-sm font-medium text-slate-300 hover:bg-slate-800 transition-colors">Cancel</button>
        <button onclick="saveTask()" class="px-5 py-2 bg-indigo-600 hover:bg-indigo-500 text-white rounded-lg text-sm font-medium shadow-lg shadow-indigo-500/20 transition-all">Save Task</button>
      </div>
    </div>
  </div>

  <script>
    // --- State Management ---
    let tasks = JSON.parse(localStorage.getItem('taskpulse_tasks')) || [];
    let currentFilter = 'all'; 
    let currentStatusFilter = 'all';
    let currentCategoryFilter = 'all';
    let currentDate = new Date();
    let tempSubtasks = [];

    // --- Utility Functions ---
    const escapeHtml = (unsafe) => (unsafe || '').replace(/[&<"'>]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' }[c]));
    
    function getISODateString(date) {
      if (!date) return '';
      if (typeof date === 'string' && /^\d{4}-\d{2}-\d{2}$/.test(date)) return date;
      const d = new Date(date);
      if (isNaN(d.getTime())) return '';
      return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
    }

    function saveTasks() {
      localStorage.setItem('taskpulse_tasks', JSON.stringify(tasks));
    }

    // --- Data Export & Import Logic ---
    function exportData() {
      if (tasks.length === 0) {
        alert("There are no tasks to backup yet.");
        return;
      }
      
      const dataStr = JSON.stringify(tasks, null, 2);
      const dataBlob = new Blob([dataStr], { type: 'application/json' });
      const url = URL.createObjectURL(dataBlob);
      
      const a = document.createElement('a');
      a.href = url;
      a.download = `taskplus_backup_${getISODateString(new Date())}.json`;
      document.body.appendChild(a);
      a.click();
      
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
    }

    function importData(event) {
      const file = event.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function(e) {
        try {
          const importedTasks = JSON.parse(e.target.result);
          if (Array.isArray(importedTasks)) {
            if (confirm(`Restore from backup? This will overwrite your current task list with ${importedTasks.length} imported tasks.`)) {
              tasks = importedTasks;
              saveTasks();
              renderApp();
            }
          } else {
            alert("Invalid backup file format. Expected a list of tasks.");
          }
        } catch (error) {
          alert("Error reading backup file. Please ensure it is a valid TaskPlus .json backup.");
        }
        event.target.value = ''; // Reset input to allow selecting the same file again
      };
      reader.readAsText(file);
    }

    // --- Mobile View Toggle Logic ---
    function setMobileView(view) {
      const taskPanel = document.getElementById('taskPanel');
      const calendarPanel = document.getElementById('calendarPanel');
      const btnList = document.getElementById('btnListView');
      const btnCalendar = document.getElementById('btnCalendarView');

      if (view === 'list') {
        taskPanel.classList.remove('hidden');
        taskPanel.classList.add('flex');
        calendarPanel.classList.remove('flex');
        calendarPanel.classList.add('hidden');
        
        btnList.classList.add('bg-indigo-500', 'text-white', 'shadow');
        btnList.classList.remove('text-slate-400', 'hover:text-slate-200');
        
        btnCalendar.classList.remove('bg-indigo-500', 'text-white', 'shadow');
        btnCalendar.classList.add('text-slate-400', 'hover:text-slate-200');
      } else {
        taskPanel.classList.remove('flex');
        taskPanel.classList.add('hidden');
        calendarPanel.classList.remove('hidden');
        calendarPanel.classList.add('flex');
        
        btnCalendar.classList.add('bg-indigo-500', 'text-white', 'shadow');
        btnCalendar.classList.remove('text-slate-400', 'hover:text-slate-200');
        
        btnList.classList.remove('bg-indigo-500', 'text-white', 'shadow');
        btnList.classList.add('text-slate-400', 'hover:text-slate-200');
      }
    }

    // --- Filter Logic ---
    function setFilter(filter) {
      currentFilter = filter;
      document.querySelectorAll('.filter-btn').forEach(b => {
        b.classList.remove('bg-indigo-500', 'text-white', 'shadow', 'active-filter');
        b.

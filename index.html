<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>TaskPlus - Task & Schedule Manager</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#6366f1">
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    body { background-color: #0f172a; color: #f8fafc; }
    .custom-scrollbar::-webkit-scrollbar { width: 4px; }
    .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
    .custom-scrollbar::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }
    .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: #475569; }
  </style>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js').catch((error) => {
          console.log('ServiceWorker registration failed:', error);
        });
      });
    }
  </script>
</head>
<body class="h-[100dvh] flex flex-col overflow-hidden selection:bg-indigo-500/30">

  <!-- Header -->
  <header class="bg-slate-900 border-b border-slate-800 px-4 py-3 md:px-6 flex items-center justify-between z-10 flex-shrink-0">
    <div class="flex items-center gap-3">
      <div class="w-8 h-8 rounded-lg bg-indigo-500 flex items-center justify-center text-white shadow-lg shadow-indigo-500/20">
        <i class="fas fa-bolt"></i>
      </div>
      <h1 class="text-xl font-bold bg-clip-text text-transparent bg-gradient-to-r from-white to-slate-400">TaskPlus</h1>
    </div>
    
    <div class="flex items-center gap-2 md:gap-4">
      <!-- Hidden File Input for Data Import -->
      <input type="file" id="importFile" class="hidden" accept=".json" onchange="importData(event)">
      
      <!-- Export/Import Buttons -->
<div class="flex items-center border-r border-slate-700 pr-2 md:pr-4 mr-1 md:mr-2">
  <button onclick="exportData()" class="p-2 text-slate-400 hover:text-indigo-400 transition-colors" title="Export Data Backup">
    <i class="fas fa-file-export text-lg"></i>
  </button>
  <button onclick="document.getElementById('importFile').click()" class="p-2 text-slate-400 hover:text-indigo-400 transition-colors" title="Import Data Backup">
    <i class="fas fa-file-import text-lg"></i>
  </button>
</div>

      <button onclick="openEditTaskModal()" class="bg-indigo-500 hover:bg-indigo-400 text-white px-4 py-2 rounded-lg font-medium transition-all shadow-lg shadow-indigo-500/20 flex items-center gap-2 text-sm">
        <i class="fas fa-plus"></i> <span class="hidden sm:inline">New Task</span>
      </button>
    </div>
  </header>

  <!-- Mobile View Toggle -->
  <div class="md:hidden flex bg-slate-800/80 p-1 mx-4 mt-4 rounded-lg border border-slate-700 flex-shrink-0">
    <button id="btnListView" onclick="setMobileView('list')" class="flex-1 py-2 text-sm font-medium rounded-md bg-indigo-500 text-white shadow transition-all">
      <i class="fas fa-tasks mr-2"></i>Tasks
    </button>
    <button id="btnCalendarView" onclick="setMobileView('calendar')" class="flex-1 py-2 text-sm font-medium rounded-md text-slate-400 hover:text-slate-200 transition-all">
      <i class="far fa-calendar-alt mr-2"></i>Calendar
    </button>
  </div>

  <!-- Main Content Grid -->
  <main class="flex-1 overflow-hidden p-4 md:p-6 grid grid-cols-1 md:grid-cols-12 gap-6 relative">
    
    <!-- LEFT PANEL: Task List -->
    <div id="taskPanel" class="flex md:flex flex-col gap-4 md:col-span-4 lg:col-span-3 h-full overflow-hidden w-full">
      
      <!-- Filters -->
      <div class="flex flex-col gap-3 flex-shrink-0">
        <!-- Main Filters -->
        <div class="grid grid-cols-3 bg-slate-800/50 rounded-xl p-1 border border-slate-700/50">
          <button onclick="setFilter('all')" id="filter-all" class="filter-btn active-filter px-3 py-1.5 rounded-lg text-sm font-medium transition-all bg-indigo-500 text-white shadow">All</button>
          <button onclick="setFilter('today')" id="filter-today" class="filter-btn px-3 py-1.5 rounded-lg text-sm font-medium transition-all text-slate-400 hover:text-slate-200">Today</button>
          <button onclick="setFilter('important')" id="filter-important" class="filter-btn px-3 py-1.5 rounded-lg text-sm font-medium transition-all text-slate-400 hover:text-slate-200">Important</button>
        </div>
        
        <!-- Status Filters -->
        <div class="flex flex-wrap gap-2">
          <button onclick="setStatusFilter('all')" id="status-all" class="status-btn active-status-btn px-3 py-1 rounded-lg text-xs font-medium border border-indigo-500/50 bg-indigo-500/20 text-indigo-300 transition-all">All Status</button>
          <button onclick="setStatusFilter('todo')" id="status-todo" class="status-btn px-3 py-1 rounded-lg text-xs font-medium border border-slate-700 bg-slate-800/50 text-slate-400 hover:bg-slate-700 transition-all">To Do</button>
          <button onclick="setStatusFilter('in_progress')" id="status-in_progress" class="status-btn px-3 py-1 rounded-lg text-xs font-medium border border-slate-700 bg-slate-800/50 text-slate-400 hover:bg-slate-700 transition-all">In Progress</button>
          <button onclick="setStatusFilter('completed')" id="status-completed" class="status-btn px-3 py-1 rounded-lg text-xs font-medium border border-slate-700 bg-slate-800/50 text-slate-400 hover:bg-slate-700 transition-all">Completed</button>
        </div>

        <!-- Category Pills -->
        <div id="categoryFilters" class="flex flex-wrap gap-2 pb-2 border-b border-slate-800">
          <!-- Populated dynamically -->
        </div>
      </div>

      <!-- Task List Scroll Area -->
      <div id="taskList" class="flex-1 overflow-y-auto custom-scrollbar flex flex-col gap-3 pb-20 md:pb-0 pr-1">
        <!-- Tasks populated here -->
      </div>
    </div>

    <!-- RIGHT PANEL: Calendar (Hidden on mobile by default) -->
    <div id="calendarPanel" class="hidden md:flex flex-col gap-4 md:col-span-8 lg:col-span-9 h-full bg-slate-900/50 rounded-2xl border border-slate-800 p-4 md:p-6 overflow-hidden w-full">
      <div class="flex items-center justify-between flex-shrink-0">
        <h2 id="currentMonthYear" class="text-xl md:text-2xl font-bold flex items-center gap-2">
          <i class="far fa-calendar-alt text-indigo-400"></i>
          <span></span>
        </h2>
        <div class="flex items-center gap-2 bg-slate-800/80 rounded-xl p-1 border border-slate-700">
          <button onclick="changeMonth(-1)" class="p-2 px-3 text-slate-400 hover:text-white transition-colors rounded-lg hover:bg-slate-700"><i class="fas fa-chevron-left"></i></button>
          <button onclick="goToToday()" class="px-4 py-1.5 text-sm font-medium text-slate-300 hover:text-white transition-colors">Today</button>
          <button onclick="changeMonth(1)" class="p-2 px-3 text-slate-400 hover:text-white transition-colors rounded-lg hover:bg-slate-700"><i class="fas fa-chevron-right"></i></button>
        </div>
      </div>
      <div id="calendarGrid" class="grid grid-cols-7 gap-1 md:gap-2 flex-1 overflow-y-auto custom-scrollbar content-start">
        <!-- Calendar populated here -->
      </div>
    </div>
  </main>

  <!-- Task Modal Overlay -->
  <div id="taskModal" class="fixed inset-0 bg-slate-950/80 backdrop-blur-sm hidden z-50 flex items-center justify-center p-4 opacity-0 transition-opacity">
    <div class="bg-slate-900 border border-slate-700 rounded-2xl w-full max-w-lg shadow-2xl flex flex-col max-h-[90vh]">
      <div class="p-5 border-b border-slate-800 flex justify-between items-center flex-shrink-0">
        <h3 id="modalTitle" class="text-xl font-semibold">New Task</h3>
        <button onclick="closeModal()" class="text-slate-400 hover:text-white p-1"><i class="fas fa-times text-lg"></i></button>
      </div>
      
      <div class="p-5 overflow-y-auto custom-scrollbar flex-1">
        <input type="hidden" id="taskId">
        
        <div class="space-y-4">
          <div>
            <label class="block text-xs font-medium text-slate-400 uppercase tracking-wider mb-1">Title <span class="text-rose-400">*</span></label>
            <input type="text" id="taskTitle" placeholder="What needs to be done?" class="w-full bg-slate-800 border border-slate-700 rounded-lg px-4 py-2.5 text-white placeholder-slate-500 focus:outline-none focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 transition-all">
          </div>
          
          <div>
            <label class="block text-xs font-medium text-slate-400 uppercase tracking-wider mb-1">Description</label>
            <textarea id="taskDesc" rows="2" placeholder="Add details..." class="w-full bg-slate-800 border border-slate-700 rounded-lg px-4 py-2.5 text-white placeholder-slate-500 focus:outline-none focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 transition-all resize-none"></textarea>
          </div>

          <!-- Subtasks Section -->
          <div class="bg-slate-800/50 p-3 rounded-lg border border-slate-700/50">
            <label class="block text-xs font-medium text-slate-400 uppercase tracking-wider mb-2">Subtasks</label>
            <div class="flex gap-2 mb-3">
              <input type="text" id="newSubtaskInput" placeholder="Add a subtask..." class="flex-1 bg-slate-900 border border-slate-700 rounded-lg px-3 py-1.5 text-sm text-white focus:outline-none focus:border-indigo-500">
              <button onclick="addSubtaskFromModal()" type="button" class="bg-indigo-500 hover:bg-indigo-400 text-white px-3 py-1.5 rounded-lg text-sm transition-colors"><i class="fas fa-plus"></i></button>
            </div>
            <div id="modalSubtaskList" class="flex flex-col gap-2 max-h-32 overflow-y-auto custom-scrollbar">
              <!-- Subtasks populated here -->
            </div>
          </div>
          
          <div class="grid grid-cols-2 gap-4">
            <div>
              <label class="block text-xs font-medium text-slate-400 uppercase tracking-wider mb-1">Due Date</label>
              <input type="date" id="taskDate" class="w-full bg-slate-800 border border-slate-700 rounded-lg px-4 py-2 text-white focus:outline-none focus:border-indigo-500 [color-scheme:dark]">
            </div>
            <div>
              <label class="block text-xs font-medium text-slate-400 uppercase tracking-wider mb-1">Category</label>
              <input type="text" id="taskCategory" placeholder="e.g. Work, Study" list="categoryOptions" class="w-full bg-slate-800 border border-slate-700 rounded-lg px-4 py-2 text-white placeholder-slate-500 focus:outline-none focus:border-indigo-500">
              <datalist id="categoryOptions"></datalist>
            </div>
          </div>
          
          <div class="flex items-center gap-6 pt-2">
            <label class="flex items-center gap-2 cursor-pointer group">
              <div class="relative flex items-center justify-center">
                <input type="checkbox" id="taskImportant" class="peer sr-only">
                <div class="w-5 h-5 rounded border border-slate-600 bg-slate-800 peer-checked:bg-amber-500 peer-checked:border-amber-500 transition-all"></div>
                <i class="fas fa-check text-white text-xs absolute opacity-0 peer-checked:opacity-100"></i>
              </div>
              <span class="text-sm text-slate-300 group-hover:text-white transition-colors">Mark as Important</span>
            </label>
          </div>
        </div>
      </div>
      
      <div class="p-5 border-t border-slate-800 flex justify-end gap-3 flex-shrink-0 bg-slate-900 rounded-b-2xl">
        <button onclick="closeModal()" class="px-4 py-2 rounded-lg text-sm font-medium text-slate-300 hover:bg-slate-800 transition-colors">Cancel</button>
        <button onclick="saveTask()" class="px-5 py-2 bg-indigo-600 hover:bg-indigo-500 text-white rounded-lg text-sm font-medium shadow-lg shadow-indigo-500/20 transition-all">Save Task</button>
      </div>
    </div>
  </div>

  <script>
    // --- State Management ---
    let tasks = JSON.parse(localStorage.getItem('taskpulse_tasks')) || [];
    let currentFilter = 'all'; 
    let currentStatusFilter = 'all';
    let currentCategoryFilter = 'all';
    let currentDate = new Date();
    let tempSubtasks = [];

    // --- Utility Functions ---
    const escapeHtml = (unsafe) => (unsafe || '').replace(/[&<"'>]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' }[c]));
    
    function getISODateString(date) {
      if (!date) return '';
      if (typeof date === 'string' && /^\d{4}-\d{2}-\d{2}$/.test(date)) return date;
      const d = new Date(date);
      if (isNaN(d.getTime())) return '';
      return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
    }

    function saveTasks() {
      localStorage.setItem('taskpulse_tasks', JSON.stringify(tasks));
    }

    // --- Data Export & Import Logic ---
    function exportData() {
      if (tasks.length === 0) {
        alert("There are no tasks to backup yet.");
        return;
      }
      
      const dataStr = JSON.stringify(tasks, null, 2);
      const dataBlob = new Blob([dataStr], { type: 'application/json' });
      const url = URL.createObjectURL(dataBlob);
      
      const a = document.createElement('a');
      a.href = url;
      a.download = `taskplus_backup_${getISODateString(new Date())}.json`;
      document.body.appendChild(a);
      a.click();
      
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
    }

    function importData(event) {
      const file = event.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function(e) {
        try {
          const importedTasks = JSON.parse(e.target.result);
          if (Array.isArray(importedTasks)) {
            if (confirm(`Restore from backup? This will overwrite your current task list with ${importedTasks.length} imported tasks.`)) {
              tasks = importedTasks;
              saveTasks();
              renderApp();
            }
          } else {
            alert("Invalid backup file format. Expected a list of tasks.");
          }
        } catch (error) {
          alert("Error reading backup file. Please ensure it is a valid TaskPlus .json backup.");
        }
        event.target.value = ''; // Reset input to allow selecting the same file again
      };
      reader.readAsText(file);
    }

    // --- Mobile View Toggle Logic ---
    function setMobileView(view) {
      const taskPanel = document.getElementById('taskPanel');
      const calendarPanel = document.getElementById('calendarPanel');
      const btnList = document.getElementById('btnListView');
      const btnCalendar = document.getElementById('btnCalendarView');

      if (view === 'list') {
        taskPanel.classList.remove('hidden');
        taskPanel.classList.add('flex');
        calendarPanel.classList.remove('flex');
        calendarPanel.classList.add('hidden');
        
        btnList.classList.add('bg-indigo-500', 'text-white', 'shadow');
        btnList.classList.remove('text-slate-400', 'hover:text-slate-200');
        
        btnCalendar.classList.remove('bg-indigo-500', 'text-white', 'shadow');
        btnCalendar.classList.add('text-slate-400', 'hover:text-slate-200');
      } else {
        taskPanel.classList.remove('flex');
        taskPanel.classList.add('hidden');
        calendarPanel.classList.remove('hidden');
        calendarPanel.classList.add('flex');
        
        btnCalendar.classList.add('bg-indigo-500', 'text-white', 'shadow');
        btnCalendar.classList.remove('text-slate-400', 'hover:text-slate-200');
        
        btnList.classList.remove('bg-indigo-500', 'text-white', 'shadow');
        btnList.classList.add('text-slate-400', 'hover:text-slate-200');
      }
    }

    // --- Filter Logic ---
    function setFilter(filter) {
      currentFilter = filter;
      document.querySelectorAll('.filter-btn').forEach(b => {
        b.classList.remove('bg-indigo-500', 'text-white', 'shadow', 'active-filter');
        b.classList.add('text-slate-400');
      });
      const activeBtn = document.getElementById(`filter-${filter}`);
      activeBtn.classList.remove('text-slate-400');
      activeBtn.classList.add('bg-indigo-500', 'text-white', 'shadow', 'active-filter');
      renderTasks();
    }

    function setStatusFilter(status) {
      currentStatusFilter = status;
      document.querySelectorAll('.status-btn').forEach(b => {
        b.classList.remove('border-indigo-500/50', 'bg-indigo-500/20', 'text-indigo-300', 'active-status-btn');
        b.classList.add('border-slate-700', 'bg-slate-800/50', 'text-slate-400');
      });
      const activeBtn = document.getElementById(`status-${status}`);
      activeBtn.classList.remove('border-slate-700', 'bg-slate-800/50', 'text-slate-400');
      activeBtn.classList.add('border-indigo-500/50', 'bg-indigo-500/20', 'text-indigo-300', 'active-status-btn');
      renderTasks();
    }

    function setCategoryFilter(category) {
      currentCategoryFilter = category;
      renderCategoryPills();
      renderTasks();
    }

    // --- Modal & Subtask Logic ---
    function openEditTaskModal(taskId = null) {
      const modal = document.getElementById('taskModal');
      const titleInput = document.getElementById('taskTitle');
      
      if (taskId) {
        const task = tasks.find(t => t.id === taskId);
        document.getElementById('modalTitle').textContent = 'Edit Task';
        document.getElementById('taskId').value = task.id;
        titleInput.value = task.title;
        document.getElementById('taskDesc').value = task.description || '';
        document.getElementById('taskDate').value = task.dueDate || '';
        document.getElementById('taskCategory').value = task.category || '';
        document.getElementById('taskImportant').checked = task.important || false;
        tempSubtasks = task.subtasks ? [...task.subtasks] : [];
      } else {
        document.getElementById('modalTitle').textContent = 'New Task';
        document.getElementById('taskId').value = '';
        titleInput.value = '';
        document.getElementById('taskDesc').value = '';
        document.getElementById('taskDate').value = getISODateString(new Date());
        document.getElementById('taskCategory').value = '';
        document.getElementById('taskImportant').checked = false;
        tempSubtasks = [];
      }

      renderModalSubtasks();
      
      modal.classList.remove('hidden');
      setTimeout(() => { modal.classList.remove('opacity-0'); titleInput.focus(); }, 10);
    }

    function closeModal() {
      const modal = document.getElementById('taskModal');
      modal.classList.add('opacity-0');
      setTimeout(() => modal.classList.add('hidden'), 300);
    }

    function addSubtaskFromModal() {
      const input = document.getElementById('newSubtaskInput');
      const text = input.value.trim();
      if (text) {
        tempSubtasks.push({ id: Date.now().toString(), title: text, completed: false });
        input.value = '';
        renderModalSubtasks();
      }
    }

    function removeSubtaskFromModal(id) {
      tempSubtasks = tempSubtasks.filter(st => st.id !== id);
      renderModalSubtasks();
    }

    function toggleSubtaskCompletedModal(id) {
      const st = tempSubtasks.find(s => s.id === id);
      if (st) {
        st.completed = !st.completed;
        renderModalSubtasks();
      }
    }

    function renderModalSubtasks() {
      const list = document.getElementById('modalSubtaskList');
      if (tempSubtasks.length === 0) {
        list.innerHTML = `<p class="text-xs text-slate-500 italic text-center py-2">No subtasks added.</p>`;
        return;
      }
      
      list.innerHTML = tempSubtasks.map(st => `
        <div class="flex items-center justify-between gap-2 bg-slate-900/50 p-2 rounded border border-slate-700/50 group">
          <div class="flex items-center gap-2 flex-1 min-w-0">
            <input type="checkbox" ${st.completed ? 'checked' : ''} onchange="toggleSubtaskCompletedModal('${st.id}')" class="rounded border-slate-600 bg-slate-800 text-indigo-500 focus:ring-indigo-500">
            <span class="text-sm truncate ${st.completed ? 'line-through text-slate-500' : 'text-slate-300'}">${escapeHtml(st.title)}</span>
          </div>
          <button type="button" onclick="removeSubtaskFromModal('${st.id}')" class="text-slate-500 hover:text-rose-400 opacity-0 group-hover:opacity-100 transition-opacity p-1">
            <i class="fas fa-times"></i>
          </button>
        </div>
      `).join('');
    }

    // Main App Action toggles
    function toggleSubtask(taskId, subtaskId) {
      const task = tasks.find(t => t.id === taskId);
      if (task && task.subtasks) {
        const subtask = task.subtasks.find(st => st.id === subtaskId);
        if (subtask) {
          subtask.completed = !subtask.completed;
          saveTasks();
          renderTasks();
        }
      }
    }

    function saveTask() {
      const titleInput = document.getElementById('taskTitle');
      const title = titleInput.value.trim();
      if (!title) {
        titleInput.classList.add('border-rose-500');
        setTimeout(() => titleInput.classList.remove('border-rose-500'), 1000);
        return;
      }

      const id = document.getElementById('taskId').value || Date.now().toString();
      const existingTask = tasks.find(t => t.id === id);
      
      const taskData = {
        id,
        title,
        description: document.getElementById('taskDesc').value.trim(),
        dueDate: document.getElementById('taskDate').value,
        category: document.getElementById('taskCategory').value.trim() || 'General',
        important: document.getElementById('taskImportant').checked,
        status: existingTask ? existingTask.status : 'todo',
        subtasks: [...tempSubtasks]
      };

      if (existingTask) {
        Object.assign(existingTask, taskData);
      } else {
        tasks.push(taskData);
      }

      saveTasks();
      closeModal();
      renderApp();
    }

    function deleteTask(id) {
      if(confirm('Delete this task?')) {
        tasks = tasks.filter(t => t.id !== id);
        saveTasks();
        renderApp();
      }
    }

    function toggleTaskStatus(id) {
      const task = tasks.find(t => t.id === id);
      if (task) {
        task.status = task.status === 'completed' ? 'todo' : 'completed';
        saveTasks();
        renderApp();
      }
    }

    function updateTaskStatusSelect(taskId, status) {
      const task = tasks.find(t => t.id === taskId);
      if (task) {
        task.status = status;
        saveTasks();
        renderApp();
      }
    }

    function toggleStar(id) {
      const task = tasks.find(t => t.id === id);
      if (task) {
        task.important = !task.important;
        saveTasks();
        renderApp();
      }
    }

    // --- Rendering ---
    function getCategories() {
      const cats = new Set(tasks.map(t => t.category).filter(c => c));
      return Array.from(cats).sort();
    }

    function renderCategoryPills() {
      const container = document.getElementById('categoryFilters');
      const datalist = document.getElementById('categoryOptions');
      const categories = getCategories();
      
      // Update Datalist for Modal
      datalist.innerHTML = categories.map(c => `<option value="${escapeHtml(c)}">`).join('');

      // Render Pills
      let html = `<button onclick="setCategoryFilter('all')" class="px-3 py-1 rounded-full text-xs font-medium border transition-all ${currentCategoryFilter === 'all' ? 'border-indigo-500/50 bg-indigo-500/20 text-indigo-300' : 'border-slate-700 bg-slate-800/50 text-slate-400 hover:bg-slate-700'}">All Categories</button>`;
      
      categories.forEach(cat => {
        const isActive = currentCategoryFilter === cat;
        html += `<button onclick="setCategoryFilter('${escapeHtml(cat)}')" class="px-3 py-1 rounded-full text-xs font-medium border transition-all ${isActive ? 'border-indigo-500/50 bg-indigo-500/20 text-indigo-300' : 'border-slate-700 bg-slate-800/50 text-slate-400 hover:bg-slate-700'}">${escapeHtml(cat)}</button>`;
      });
      
      container.innerHTML = html;
    }

    function renderTasks() {
      const list = document.getElementById('taskList');
      const todayStr = getISODateString(new Date());

      let filtered = tasks.filter(t => {
        // Main Filters
        let passMain = true;
        if (currentFilter === 'today') passMain = t.dueDate === todayStr;
        if (currentFilter === 'important') passMain = t.important;
        
        // Status Filters
        let passStatus = true;
        if (currentStatusFilter !== 'all') passStatus = t.status === currentStatusFilter;

        // Category Filters
        let passCategory = true;
        if (currentCategoryFilter !== 'all') passCategory = t.category === currentCategoryFilter;

        return passMain && passStatus && passCategory;
      });

      // Sort: Incomplete first, then by date, then important
      filtered.sort((a, b) => {
        if (a.status === 'completed' && b.status !== 'completed') return 1;
        if (a.status !== 'completed' && b.status === 'completed') return -1;
        if (a.important && !b.important) return -1;
        if (!a.important && b.important) return 1;
        return (a.dueDate || '9999') > (b.dueDate || '9999') ? 1 : -1;
      });

      if (filtered.length === 0) {
        list.innerHTML = `
          <div class="flex flex-col items-center justify-center h-40 text-slate-500 gap-3">
            <i class="fas fa-clipboard-check text-4xl opacity-50"></i>
            <p class="text-sm">No tasks found in this view.</p>
          </div>
        `;
        return;
      }

      list.innerHTML = filtered.map(task => {
        const isCompleted = task.status === 'completed';
        const isInProgress = task.status === 'in_progress';
        
        // Subtask Logic
        let subtasksHtml = '';
        if (task.subtasks && task.subtasks.length > 0) {
          const completedCount = task.subtasks.filter(st => st.completed).length;
          const totalCount = task.subtasks.length;
          const progressPercent = Math.round((completedCount / totalCount) * 100);
          
          subtasksHtml = `
            <div class="mt-3 pt-3 border-t border-slate-700/50">
              <div class="flex items-center justify-between text-[10px] font-medium text-slate-400 uppercase tracking-wider mb-2">
                <span>Subtasks (${completedCount}/${totalCount})</span>
                <div class="w-16 h-1.5 bg-slate-700 rounded-full overflow-hidden">
                  <div class="h-full bg-indigo-500 transition-all duration-300" style="width: ${progressPercent}%"></div>
                </div>
              </div>
              <div class="flex flex-col gap-1.5">
                ${task.subtasks.map(st => `
                  <label class="flex items-start gap-2 cursor-pointer group/st">
                    <input type="checkbox" ${st.completed ? 'checked' : ''} onchange="toggleSubtask('${task.id}', '${st.id}')" class="mt-0.5 rounded border-slate-600 bg-slate-800 text-indigo-500 focus:ring-indigo-500 w-3.5 h-3.5 flex-shrink-0 cursor-pointer">
                    <span class="text-xs ${st.completed ? 'line-through text-slate-500' : 'text-slate-300 group-hover/st:text-white'} transition-colors">${escapeHtml(st.title)}</span>
                  </label>
                `).join('')}
              </div>
            </div>
          `;
        }
        
        return `
          <div class="bg-slate-800/80 border ${isInProgress ? 'border-amber-500/50' : 'border-slate-700'} hover:border-slate-600 rounded-xl p-4 transition-all shadow-lg flex flex-col group relative">
            <div class="flex items-start justify-between gap-3">
              <div class="flex items-start gap-3 flex-1 min-w-0">
                <button onclick="toggleTaskStatus('${task.id}')" class="mt-0.5 text-slate-400 hover:text-emerald-400 transition-colors flex-shrink-0">
                  <i class="${isCompleted ? 'fas fa-check-circle text-emerald-400 text-lg' : 'far fa-circle text-lg'}"></i>
                </button>
                <div class="flex-1 min-w-0">
                  <h3 class="font-semibold text-slate-100 truncate ${isCompleted ? 'line-through text-slate-500' : ''}">${escapeHtml(task.title)}</h3>
                  ${task.description ? `<p class="text-xs text-slate-400 mt-1 line-clamp-2">${escapeHtml(task.description)}</p>` : ''}
                </div>
              </div>
              <div class="flex items-center gap-1 opacity-100 md:opacity-0 group-hover:opacity-100 transition-opacity">
                <button onclick="toggleStar('${task.id}')" class="p-1.5 text-slate-400 hover:text-amber-400 transition-colors"><i class="${task.important ? 'fas fa-star text-amber-400' : 'far fa-star'}"></i></button>
                <button onclick="deleteTask('${task.id}')" class="p-1.5 text-slate-400 hover:text-rose-400 transition-colors"><i class="fas fa-trash"></i></button>
              </div>
            </div>

            ${subtasksHtml}

            <div class="flex items-center justify-between text-xs pt-3 mt-3 border-t border-slate-700/50 cursor-pointer" onclick="openEditTaskModal('${task.id}')">
              <div class="flex items-center gap-2">
                <select onclick="event.stopPropagation()" onchange="updateTaskStatusSelect('${task.id}', this.value)" class="bg-slate-900/80 text-xs text-slate-300 border border-slate-700 rounded-lg px-2 py-1 outline-none focus:border-indigo-500 cursor-pointer">
                  <option value="todo" ${task.status === 'todo' ? 'selected' : ''}>⏳ To Do</option>
                  <option value="in_progress" ${task.status === 'in_progress' ? 'selected' : ''}>⚡ In Progress</option>
                  <option value="completed" ${task.status === 'completed' ? 'selected' : ''}>✅ Completed</option>
                </select>
                ${task.category ? `<span class="px-2 py-0.5 rounded-full text-[10px] font-medium bg-indigo-500/10 text-indigo-400 border border-indigo-500/20">${escapeHtml(task.category)}</span>` : ''}
              </div>
              ${task.dueDate ? `<span class="text-[11px] text-slate-400 flex items-center gap-1"><i class="far fa-calendar-alt"></i>${task.dueDate === todayStr ? 'Today' : task.dueDate}</span>` : ''}
            </div>
          </div>
        `;
      }).join('');
    }

    function renderCalendar() {
      const grid = document.getElementById('calendarGrid');
      const year = currentDate.getFullYear();
      const month = currentDate.getMonth();
      const firstDay = new Date(year, month, 1).getDay();
      const daysInMonth = new Date(year, month + 1, 0).getDate();
      const todayStr = getISODateString(new Date());

      document.getElementById('currentMonthYear').querySelector('span').textContent = new Date(year, month).toLocaleString('default', { month: 'long', year: 'numeric' });

      let html = ['SUN', 'MON', 'TUE', 'WED', 'THU', 'FRI', 'SAT'].map(d => `<div class="text-center font-bold text-slate-500 text-[10px] md:text-xs py-1 tracking-widest">${d}</div>`).join('');

      for (let i = 0; i < firstDay; i++) {
        html += `<div class="bg-slate-800/20 rounded-xl min-h-[70px] md:min-h-[90px] border border-slate-800/40 opacity-30"></div>`;
      }

      for (let day = 1; day <= daysInMonth; day++) {
        const dayStr = getISODateString(new Date(year, month, day));
        const isToday = dayStr === todayStr;
        const dayTasks = tasks.filter(t => t.dueDate === dayStr);

        html += `
          <div class="bg-slate-800/50 hover:bg-slate-800/80 rounded-xl p-1.5 md:p-2 min-h-[70px] md:min-h-[90px] border ${isToday ? 'border-indigo-500 bg-indigo-500/10' : 'border-slate-700/50'} flex flex-col gap-1 transition-all overflow-hidden group">
            <div class="flex items-center justify-between">
              <span class="text-xs md:text-sm font-bold ${isToday ? 'text-indigo-400' : 'text-slate-300'}">${day}</span>
              ${dayTasks.length > 0 ? `<span class="text-[9px] md:text-[10px] bg-slate-700 text-slate-300 px-1.5 py-0.5 rounded-full">${dayTasks.length}</span>` : ''}
            </div>
            <div class="flex-col gap-1 overflow-y-auto max-h-[45px] md:max-h-[65px] custom-scrollbar flex flex-1">
              ${dayTasks.map(t => `
                <div onclick="openEditTaskModal('${t.id}')" title="${escapeHtml(t.title)}" class="cursor-pointer text-[9px] md:text-[10px] px-1.5 py-0.5 rounded md:rounded-md truncate font-medium flex items-center gap-1 ${
                  t.status === 'completed' ? 'bg-emerald-500/10 text-emerald-400 line-through' :
                  t.status === 'in_progress' ? 'bg-amber-500/10 text-amber-400 border border-amber-500/20' :
                  'bg-indigo-500/10 text-indigo-300 border border-indigo-500/20'
                }">
                  <span class="w-1 md:w-1.5 h-1 md:h-1.5 rounded-full ${t.status === 'completed' ? 'bg-emerald-400' : t.status === 'in_progress' ? 'bg-amber-400' : 'bg-indigo-400'} flex-shrink-0"></span>
                  <span class="truncate">${escapeHtml(t.title)}</span>
                </div>
              `).join('')}
            </div>
          </div>
        `;
      }
      grid.innerHTML = html;
    }

    function changeMonth(offset) {
      currentDate.setMonth(currentDate.getMonth() + offset);
      renderCalendar();
    }
    
    function goToToday() {
      currentDate = new Date();
      renderCalendar();
    }

    function renderApp() {
      renderCategoryPills();
      renderTasks();
      renderCalendar();
    }

    // Modal Events
    document.getElementById('taskModal').addEventListener('click', e => { if (e.target.id === 'taskModal') closeModal(); });
    document.getElementById('newSubtaskInput').addEventListener('keypress', e => { if (e.key === 'Enter') { e.preventDefault(); addSubtaskFromModal(); }});

    // Init
    renderApp();
  </script>
</body>
</html>
